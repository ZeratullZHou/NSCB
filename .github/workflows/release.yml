name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .bat/.cmd are CRLF
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          bad = [str(p) for p in pathlib.Path('.').rglob('*')
                 if p.suffix.lower() in ('.bat', '.cmd') and b'\r\n' not in p.read_bytes()]
          for p in bad:
              print('::error::批处理脚本缺少 CRLF 换行（cmd.exe 无法解析）: ' + p)
          sys.exit(1 if bad else 0)
          EOF

      - name: Package runnable distribution
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="NSCB_${VERSION}"
          mkdir -p "dist/${PKG}"
          rsync -a ./ "dist/${PKG}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'Documentation and Resources' \
            --exclude 'keys.txt'
          cd dist
          zip -r "../${PKG}.zip" "${PKG}"
          cd ..
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NSCB_*.zip
            NSCB_*.zip.sha256
          generate_release_notes: true
